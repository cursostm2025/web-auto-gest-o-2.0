<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0060B1">
    <title>Cadastro de aluno | Web Autogestão</title>
    <link rel="stylesheet" href="/css/acesso.css">
</head>
<body>
    <main class="access-page">
        <section class="access-card access-card-wide" aria-labelledby="titulo-cadastro">
            <a class="brand" href="/" aria-label="Web Autogestão, página inicial">
                <span class="brand-mark" aria-hidden="true">WA</span>
                <span>Web <strong>Autogestão</strong></span>
            </a>
            <span class="eyebrow">Seu próximo passo começa aqui</span>
            <h1 id="titulo-cadastro">Cadastre-se como aluno</h1>
            <p class="intro">Informe seus dados para encontrar instrutores e começar sua jornada.</p>

            <form id="form-cadastro-aluno" class="form-grid">
                <div class="form-field">
                    <label for="nome">Nome completo</label>
                    <input id="nome" name="nome" type="text" autocomplete="name"
                           maxlength="100" required placeholder="Seu nome completo">
                </div>
                <div class="form-field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email"
                           maxlength="100" required placeholder="voce@exemplo.com">
                </div>
                <div class="form-field">
                    <label for="telefone">Telefone (WhatsApp)</label>
                    <input id="telefone" name="telefone" type="tel" autocomplete="tel"
                           maxlength="20" required placeholder="(11) 99999-9999">
                </div>
                <div class="form-field">
                    <label for="endereco">Endereço</label>
                    <input id="endereco" name="endereco" type="text" autocomplete="street-address"
                           maxlength="255" placeholder="Bairro, cidade - estado">
                </div>
                <div class="form-field">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" autocomplete="new-password"
                           minlength="8" required placeholder="Mínimo de 8 caracteres">
                </div>
                <div class="form-field">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input id="confirmar-senha" name="confirmarSenha" type="password"
                           autocomplete="new-password" minlength="8" required placeholder="Digite a senha novamente">
                </div>
                <p id="mensagem-cadastro" class="form-message form-grid-message"
                   role="status" aria-live="polite"></p>
                <button class="button button-orange form-grid-submit" type="submit">Criar meu cadastro</button>
            </form>

            <p class="access-switch">Já tem cadastro? <a href="/login-aluno.html">Entrar como aluno</a></p>
            <a class="back-link" href="/">← Voltar para a página inicial</a>
        </section>
    </main>
    <script src="/js/cadastro-aluno.js" defer></script>
</body>
</html>
