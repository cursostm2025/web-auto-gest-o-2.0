<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Autogestão - Registar Instrutor</title>
    <!-- Liga o ficheiro CSS específico para este formulário -->
    <link rel="stylesheet" href="/css/cadastro.css">
</head>
<body>

    <div class="container">
        <h2>Registar Novo Instrutor</h2>
        
        <!-- O 'id' permite que o JavaScript encontre e controle este formulário -->
        <form id="form-instrutor">
            
            <div class="grupo-input">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: Ana Cleide">
            </div>

            <div class="grupo-input">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="ana@email.com">
            </div>

            <div class="grupo-input">
                <label for="telefoneWhatsapp">WhatsApp *</label>
                <!-- O placeholder instrui a colocar o código do país e DDD -->
                <input type="text" id="telefoneWhatsapp" name="telefoneWhatsapp" required placeholder="5561999999999">
            </div>

            <div class="grupo-input">
                <label for="endereco">Endereço (Opcional)</label>
                <input type="text" id="endereco" name="endereco" placeholder="Bairro, Cidade - Estado">
            </div>

            <div class="grupo-input">
                <label for="veiculo">Veículo (Opcional)</label>
                <input type="text" id="veiculo" name="veiculo" placeholder="Ex: Peugeot 308 Manual">
            </div>

            <div class="grupo-input">
                <label for="categoriaCnh">Categoria CNH (Opcional)</label>
                <input type="text" id="categoriaCnh" name="categoriaCnh" placeholder="Ex: A, B, AB">
            </div>

            <div class="grupo-input">
                <label for="descricao">Descrição (Opcional)</label>
                <textarea id="descricao" name="descricao" rows="3" placeholder="Fale um pouco sobre o instrutor..."></textarea>
            </div>

            <!-- Div para mostrar mensagens de sucesso ou erro após o envio -->
            <div id="mensagem-retorno"></div>

            <button type="submit" class="btn-salvar">Guardar Instrutor</button>
            <a href="/admin-painel.html" class="btn-voltar">Voltar ao painel</a>
            
        </form>
    </div>

    <!-- Liga o ficheiro JavaScript com a lógica de envio -->
    <script src="/js/cadastro.js"></script>
</body>
</html>
