<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0060B1">
    <title>Login do administrador | Web Autogestão</title>
    <link rel="stylesheet" href="/css/acesso.css">
</head>
<body>
    <main class="access-page">
        <section class="access-card" aria-labelledby="titulo-login">
            <a class="brand" href="/" aria-label="Web Autogestão, página inicial">
                <span class="brand-mark" aria-hidden="true">WA</span>
                <span>Web <strong>Autogestão</strong></span>
            </a>
            <span class="eyebrow">Área administrativa</span>
            <h1 id="titulo-login">Bem-vindo de volta</h1>
            <p class="intro">Entre com suas credenciais para gerenciar os instrutores.</p>

            <form id="form-login-admin">
                <div class="form-field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="username"
                           maxlength="100" required placeholder="admin@exemplo.com">
                </div>
                <div class="form-field">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" autocomplete="current-password"
                           required placeholder="Digite sua senha">
                </div>
                <p id="mensagem-login" class="form-message" role="status" aria-live="polite"></p>
                <button class="button button-primary" type="submit">Entrar</button>
            </form>

            <a class="back-link" href="/">← Voltar para a página inicial</a>
        </section>
    </main>
    <script src="/js/login-admin.js" defer></script>
</body>
</html>
